name: test

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'lib/groups.ts'
      - 'lib/adminToken.ts'
      - 'middleware.ts'
      - 'app/index.mjs'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'lib/groups.ts'
      - 'lib/adminToken.ts'
      - 'middleware.ts'
      - 'app/index.mjs'
      - '.github/workflows/test.yml'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cognito pre-token trigger
        run: node --test infra/cognito-pretoken/index.test.mjs
