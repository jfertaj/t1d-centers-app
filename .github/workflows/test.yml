name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cognito pre-token trigger
        run: node --test infra/cognito-pretoken/index.test.mjs
